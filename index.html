<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4f2">
    <title>A little question for Daisy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <div class="flower flower-left" aria-hidden="true">✿</div>
        <div class="flower flower-right" aria-hidden="true">✿</div>

        <section class="card" aria-labelledby="question">
            <div class="eyebrow"><span aria-hidden="true">♡</span> A little question for you</div>
            <div class="bouquet" aria-hidden="true">🌼</div>
            <p class="hello">Hey, Daisy</p>
            <h1 id="question">You make my days<br>feel a little brighter.</h1>
            <p class="message">I’ve really loved getting closer to you, and I was wondering...</p>
            <p class="ask">Would you be my partner?</p>

            <div class="choices" id="choices">
                <button class="button button-yes" id="yes-button" type="button">Yes, I’d love to! <span aria-hidden="true">♡</span></button>
                <button class="button button-talk" id="no-button" type="button">No, thank you</button>
            </div>
            <p class="response" id="response" aria-live="polite"></p>
            <p class="signoff">No matter what, I’m glad you’re in my life <span aria-hidden="true">☺</span></p>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
